services:
  it-copilot-python:
    build:
      context: ../IT-Copilot
      dockerfile: Dockerfile
      target: production
    container_name: it-copilot-python
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ../IT-Copilot/.env
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-it-copilot123}
      REDIS_URL: redis://:${REDIS_PASSWORD:-it-copilot123}@redis:6379/0
      CHROMA_PERSIST_DIRECTORY: /app/data/chroma
      EVAL_BASELINE_PATH: /app/data/eval/baseline.json
      IT_COPILOT_SKILLS_DIR: /app/skills
    volumes:
      - it-copilot-python-data:/app/data
      - ../IT-Copilot/skills:/app/skills
      - ../IT-Copilot/config/mcp_servers.json:/app/config/mcp_servers.json:ro
    depends_on:
      redis:
        condition: service_started
      chromadb:
        condition: service_started
    restart: unless-stopped
    networks:
      - it-copilot-network

  it-copilot-java:
    build:
      context: ../IT-CopilotJava
      dockerfile: Dockerfile
    container_name: it-copilot-java
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - ../IT-CopilotJava/.env
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-it-copilot123}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      IT_COPILOT_DATA_DIR: /app/data/java
      KNOWLEDGE_STORE_PATH: /app/data/java/knowledge-store.json
      MEMORY_STORE_PATH: /app/data/java/memory-store.json
      IT_COPILOT_SKILLS_DIR: /app/skills
    volumes:
      - it-copilot-java-data:/app/data
      - ../IT-CopilotJava/skills:/app/skills
    depends_on:
      redis:
        condition: service_started
      chromadb:
        condition: service_started
    restart: unless-stopped
    networks:
      - it-copilot-network

  redis:
    image: redis:7-alpine
    container_name: it-copilot-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-it-copilot123}
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - it-copilot-network

  chromadb:
    image: chromadb/chroma:0.5.23
    container_name: it-copilot-chromadb
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /chroma/chroma
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - chromadb-data:/chroma/chroma
    restart: unless-stopped
    networks:
      - it-copilot-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: it-copilot-frontend
    environment:
      PYTHON_API_URL: /api/python
      JAVA_API_URL: /api/java
    ports:
      - "${FRONTEND_PORT:-5174}:80"
    depends_on:
      it-copilot-python:
        condition: service_started
      it-copilot-java:
        condition: service_started
    restart: unless-stopped
    networks:
      - it-copilot-network

  nginx:
    image: nginx:1.27-alpine
    container_name: it-copilot-gateway
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - ./docker/nginx-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_started
      it-copilot-python:
        condition: service_started
      it-copilot-java:
        condition: service_started
    restart: unless-stopped
    networks:
      - it-copilot-network

networks:
  it-copilot-network:
    driver: bridge

volumes:
  redis-data:
  chromadb-data:
  it-copilot-python-data:
  it-copilot-java-data:
