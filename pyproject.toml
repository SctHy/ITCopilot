[build-system]
requires = ["uv_build>=0.12,<0.14"]
build-backend = "uv_build"

[project]
name = "servicedesk-agent"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
  "pydantic-ai-slim[openai]==2.64.0",
  "fastapi==0.162.0",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.14.2",
  "python-multipart==0.0.33",
  "redis==8.1.0",
  "pgvector==0.5.1",
  "numpy==2.5.4",
  "onnxruntime==1.31.1",
  "tokenizers==0.23.3",
  "fastembed==0.9.1",
  "aiosqlite==0.22.1",
  "sqlalchemy[asyncio]==2.1.6",
  "alembic==1.20.1",
  "psycopg[binary]==3.3.6",
  "pyjwt[crypto]==2.15.1",
  "cryptography==50.0.2",
  "prometheus-client==0.26.0",
  "opentelemetry-sdk==1.45.2",
  "opentelemetry-exporter-otlp-proto-grpc==1.45.2",
  "httpx2==2.16.0",
  "python-dotenv==1.2.4",
  "pyyaml==6.0.3",
  "jsonschema==4.26.0",
]

[dependency-groups]
dev = [
  "pytest==9.2.0",
  "pytest-asyncio==1.4.1",
  "fakeredis[lua]==2.40.0",
  "ruff==0.17.3"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F"]
