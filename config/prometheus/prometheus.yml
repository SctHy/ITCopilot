# Prometheus 配置文件 — IT-Copilot 企业内部 IT 服务台

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'it-copilot'
    environment: 'production'

rule_files:
  - "alerts/*.yml"

scrape_configs:
  # IT-Copilot 主应用指标
  - job_name: 'it-copilot-app'
    static_configs:
      - targets: ['it-copilot:8000']
        labels:
          service: 'it-copilot'
    scrape_interval: 10s
    metrics_path: '/metrics'

  # Prometheus 自监控
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
