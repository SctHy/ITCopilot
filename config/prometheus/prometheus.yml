# Prometheus 配置 — IT-Copilot 企业内部 IT 服务台（docker compose --profile observability）
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: it-copilot

rule_files:
  - /etc/prometheus/alerts/*.yml

scrape_configs:
  - job_name: it-copilot-api
    metrics_path: /metrics
    scrape_interval: 10s
    static_configs:
      - targets: ["api:8001"]
        labels:
          service: it-copilot

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
